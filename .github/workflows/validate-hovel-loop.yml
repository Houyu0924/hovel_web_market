name: Validate HOVEL Loop Data

on:
  pull_request:
    paths:
      - "loop-engineering/**"
      - ".github/workflows/validate-hovel-loop.yml"
  push:
    branches:
      - main
    paths:
      - "loop-engineering/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configuration and CSV files
        run: python scripts/validate_hovel_loop.py
